# CI inicial: valida construcción frontend y tests backend por separado.
name: Integracion continua
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -r services/api/requirements.txt -r services/ml/requirements.txt
      - name: Ejecutar tests
        working-directory: services/api
        run: python -m pytest ../../tests/backend -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Compilar
        working-directory: apps/web
        run: npm run build
