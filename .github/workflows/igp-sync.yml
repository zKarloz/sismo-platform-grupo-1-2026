# Ingesta automatizada IGP/CENSIS y avisos operativos administrados.
# El sistema de suscripciones personales ya no ejecuta tareas programadas.
# Esta tarea NO emite alertas tempranas ni predice terremotos.
# No necesita mantener FastAPI/Render activo y no reemplaza ci.yml.
name: Sincronización IGP a Supabase

on:
  # GitHub ejecuta los cron en la rama predeterminada; horario en UTC.
  # Minuto 17 de cada hora, para evitar la carga del minuto 0.
  schedule:
    - cron: '17 * * * *'
    # Conciliación diaria del catálogo completo 2026 (UTC; puede retrasarse).
    - cron: '33 8 * * *'
  # Permite validar una ejecución desde la pestaña Actions.
  workflow_dispatch:
    inputs:
      test_operational_email:
        description: 'Prueba controlada: enviar solo avisos aprobados al destinatario autorizado (requiere habilitación adicional)'
        required: false
        type: boolean
        default: false

# Solo leemos el repositorio: las escrituras son a PostgreSQL mediante secret.
permissions:
  contents: read

# No lanzar dos copias simultáneas de esta sincronización.
concurrency:
  group: igp-sync-supabase
  cancel-in-progress: false

jobs:
  igp-sync:
    name: Consultar IGP y persistir reportes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/api

    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Preparar Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - name: Instalar dependencias de FastAPI e ingesta
        run: python -m pip install -r requirements.txt

      - name: Verificar que existe DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # No imprimir el secreto en logs.
          if [ -z "$DATABASE_URL" ]; then
            echo '::error::Falta crear el secret DATABASE_URL en GitHub Actions.'
            exit 1
          fi

      - name: Sincronizar reportes IGP a Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: '1'
        run: |
          # Conservar el código de salida del CLI aunque exista tee.
          set -o pipefail
          python -m app.commands.sync_igp --limit 100 | tee "$RUNNER_TEMP/igp-sync.log"

          # PARCIAL es técnicamente una ejecución válida, pero NO una
          # confirmación de catálogo completo. Señalarlo en el resumen.
          if grep -q '^PARCIAL' "$RUNNER_TEMP/igp-sync.log"; then
            echo '::warning::La ingesta IGP fue parcial: revisar ingestion_runs.error_summary.'
            echo '### IGP: sincronización parcial' >> "$GITHUB_STEP_SUMMARY"
            echo 'Se guardaron los registros válidos, pero algunos fueron omitidos. Revisar ingestion_runs.error_summary en Supabase.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### IGP: sincronización completada' >> "$GITHUB_STEP_SUMMARY"
            echo 'Revisar el detalle de registros y fecha en ingestion_runs.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Conciliar reportes IGP 2026 (solo calendario diario)
        # No ejecutar un backfill pesado en cada ciclo horario, ni al pulsar Run workflow.
        if: github.event_name == 'schedule' && github.event.schedule == '33 8 * * *'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m app.commands.backfill_igp_2026 --apply --page-size 200

      - name: Evaluar reglas sobre sismos reportados
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # No evalúa eventos de antes de la activación ni datos con más de 24 h.
          python -m app.commands.alerts evaluate

      - name: Publicar avisos internos aprobados
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # No realiza envíos externos ni salta aprobación humana.
          python -m app.commands.alerts dispatch

      - name: Enviar correos operativos aprobados (solo calendario habilitado)
        # Sustituye definitivamente el envío personal. La bandera está
        # desactivada hasta que el administrador complete el corte en GitHub.
        # Requiere además que el antiguo flag personal quede EXPLICITAMENTE false.
        # No ejecutar este paso en workflow_dispatch: la prueba manual ya está
        # aislada y limitada a un único destinatario.
        if: ${{ github.event_name == 'schedule' && vars.ENABLE_OPERATIONAL_EMAIL == 'true' && vars.ENABLE_PERSONAL_EMAIL == 'false' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALERT_SMTP_HOST: ${{ secrets.ALERT_SMTP_HOST }}
          ALERT_SMTP_PORT: ${{ vars.ALERT_SMTP_PORT || '465' }}
          ALERT_SMTP_FROM: ${{ secrets.ALERT_SMTP_FROM }}
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
          # Correos operativos únicamente sobre eventos recientes (UTC).
          OPERATIONAL_EMAIL_MAX_AGE_HOURS: ${{ vars.OPERATIONAL_EMAIL_MAX_AGE_HOURS || '6' }}
          OPERATIONAL_EMAIL_BATCH_LIMIT: ${{ vars.OPERATIONAL_EMAIL_BATCH_LIMIT || '10' }}
          OPERATIONAL_EMAIL_TEST_MODE: 'false'
        run: |
          set -euo pipefail
          # Fallar sin tocar la cola si la configuración SMTP es incompleta.
          if [ -z "$ALERT_SMTP_HOST" ] || [ -z "$ALERT_SMTP_FROM" ] || [ -z "$ALERT_SMTP_USER" ] || [ -z "$ALERT_SMTP_PASSWORD" ]; then
            echo '::error::Faltan los secretos SMTP para el correo operativo.'
            exit 1
          fi
          python -m app.commands.alerts dispatch --send-email
          echo '### Centro de alertas: correo operativo procesado' >> "$GITHUB_STEP_SUMMARY"
          echo 'Se procesaron únicamente entregas autorizadas de eventos recientes. Revisar Centro de alertas > Entregas.' >> "$GITHUB_STEP_SUMMARY"

      - name: Probar envío operativo de alertas aprobadas (solo manual)
        # Prueba de diagnóstico: independiente del cron y de las colas personales.
        # Exige selección manual y variable explícita.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_operational_email == true && vars.ENABLE_OPERATIONAL_EMAIL == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALERT_SMTP_HOST: ${{ secrets.ALERT_SMTP_HOST }}
          ALERT_SMTP_PORT: ${{ vars.ALERT_SMTP_PORT || '465' }}
          ALERT_SMTP_FROM: ${{ secrets.ALERT_SMTP_FROM }}
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
          # La selección y reserva se limitan a este email en FastAPI.
          OPERATIONAL_EMAIL_TEST_MODE: 'true'
          OPERATIONAL_EMAIL_MAX_AGE_HOURS: ${{ vars.OPERATIONAL_EMAIL_MAX_AGE_HOURS || '6' }}
          OPERATIONAL_EMAIL_TEST_RECIPIENT: ${{ secrets.OPERATIONAL_EMAIL_TEST_RECIPIENT }}
        run: |
          set -euo pipefail
          # Nunca volcar credenciales o la dirección privada en logs.
          if [ -z "$OPERATIONAL_EMAIL_TEST_RECIPIENT" ]; then
            echo '::error::Falta el secreto OPERATIONAL_EMAIL_TEST_RECIPIENT.'
            exit 1
          fi
          if [ -z "$ALERT_SMTP_HOST" ] || [ -z "$ALERT_SMTP_FROM" ] || [ -z "$ALERT_SMTP_USER" ] || [ -z "$ALERT_SMTP_PASSWORD" ]; then
            echo '::error::Faltan secretos SMTP para la prueba operativa.'
            exit 1
          fi
          # Solo entrega reglas email activas y aprobadas, con destino autorizado.
          python -m app.commands.alerts dispatch --send-email
          echo '### Centro de alertas: prueba operativa ejecutada' >> "$GITHUB_STEP_SUMMARY"
          echo 'Revisar el resultado en Centro de alertas > Entregas. SMTP aceptado no equivale a lectura.' >> "$GITHUB_STEP_SUMMARY"

